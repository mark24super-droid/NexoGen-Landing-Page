kind = "web"
previewPath = "/"
title = "NexoGen"
description = "A local-first business landing-page builder with templates, a visual editor, browser-saved drafts, and HTML and JSON exports."
version = "1.0.0"
id = "artifacts/nexogen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24942

[services.development]
run = "pnpm --filter @workspace/nexogen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexogen", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexogen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24942"
BASE_PATH = "/"
